[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-monitor"
version = "0.1.0"
description = "RFP monitoring pipeline for CanadaBuys, Merx, and other procurement sources"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Sergio Lopez Olvera" }
]
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "feedparser>=6.0.11",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "uvicorn>=0.30.6",
  "rich>=13.7.1",
  "tenacity>=8.5.0",
  "openai>=1.40.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2"
]

[project.scripts]
rfp-monitor = "main:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
